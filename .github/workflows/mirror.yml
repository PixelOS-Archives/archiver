name: Mirror SourceForge to GitHub Releases

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget coreutils
          
      - name: Run Mirror Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python mirror.py
        
      - name: Commit and Push log.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add log.json || echo "No log.json to add"
          git commit -m "chore: Update mirror log.json [skip ci]" || echo "No changes to commit"
          git push origin HEAD || echo "No changes to push"
